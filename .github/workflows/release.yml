# SPDX-License-Identifier: MPL-2.0
# Build .deb and .rpm packages and attach them to a GitHub Release.
name: Release packages

on:
  release:
    types: [created]
  # Allow building packages on demand without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build .deb and .rpm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libvulkan-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libexpat1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install packagers
        run: cargo install cargo-deb cargo-generate-rpm

      - name: Build release binary
        run: cargo build --release --locked

      - name: Strip binary
        run: strip target/release/cosmic-ext-vpn-menu

      - name: Build .deb
        run: cargo deb --no-build --no-strip

      - name: Build .rpm
        run: cargo generate-rpm

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          ls -l dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
